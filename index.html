<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6f1d34">
  <title>Find Your Table | Jatinder & Jessica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <img class="logo" src="logo.svg" alt="Jatinder and Jessica logo">
      <p class="eyebrow">15 August 2026</p>
      <h1>Jatinder &amp; Jessica</h1>
      <p class="script-heading">Wedding Reception</p>
    </header>

    <section class="search-panel" aria-labelledby="find-heading">
      <div class="divider" aria-hidden="true"></div>
      <h2 id="find-heading">Find Your Table</h2>
      <p class="intro">Enter your first name, surname or full name.</p>

      <form id="search-form" class="search-form">
        <label class="sr-only" for="guest-search">Guest name</label>
        <input id="guest-search" type="search" placeholder="Enter your name" autocomplete="name">
        <button type="submit">Search</button>
      </form>

      <p id="message" class="message" aria-live="polite"></p>
      <div id="results" class="results" aria-live="polite"></div>
    </section>

    <section id="venue-section" class="venue-section" hidden>
      <div class="venue-heading-row">
        <div>
          <p class="eyebrow">Reception Floor Plan</p>
          <h2>Venue Layout</h2>
        </div>
        <button id="close-map" class="text-button" type="button">Hide layout</button>
      </div>
      <div id="map-frame" class="map-frame">
        <div id="map-canvas" class="map-canvas">
          <picture>
            <source srcset="venue-layout.png" type="image/png">
            <source srcset="venue-layout.jpg" type="image/jpeg">
            <img id="venue-map" src="venue-layout.svg" alt="Wedding reception venue layout">
          </picture>
          <div id="table-highlight" class="table-highlight" aria-hidden="true"></div>
        </div>
      </div>
      <p class="map-note">Pinch to zoom on your phone. Your table name remains shown above the layout.</p>
    </section>

    <footer>
      <p>Need assistance? Please speak to a member of the wedding party.</p>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
